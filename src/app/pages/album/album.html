<section class="secao album">
  <a class="voltar" routerLink="/fotos">← Todos os trabalhos</a>
  @if (album(); as projeto) {
    <header><p class="eyebrow">{{ projeto.categoria }}</p><h1>{{ projeto.titulo }}</h1>
      <div class="detalhes"><p class="texto">{{ projeto.descricao }}</p>
        <dl><div><dt>Data</dt><dd>{{ data(projeto.data) }}</dd></div><div><dt>Local</dt><dd>{{ projeto.local }}</dd></div></dl>
      </div>
    </header>
    <app-galeria [fotos]="projeto.fotos" />
  } @else { <h1>Álbum não encontrado.</h1><p class="texto">Volte à galeria para explorar os trabalhos disponíveis.</p> }
</section>
